[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ams-copilot"
version = "0.1.0"
description = "Agentes de IA para triagem, diagnóstico e documentação de chamados de AMS SAP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Denis Palhares Gonçalves" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "mcp>=2.0,<3",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
ams-copilot = "ams_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ams_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requer PostgreSQL com pgvector (AMS_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
