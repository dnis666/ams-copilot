services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams
      POSTGRES_DB: ams
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AMS_DATABASE_URL: postgresql://ams:ams@postgres:5432/ams
      AMS_AUDIT_DB_PATH: /app/var/audit.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit:/app/var
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  audit:
